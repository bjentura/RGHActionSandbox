name: Run R code checks

on:
    push:
        branches: 
            - master
    pull_request: 
        branches: 
            - master

jobs:
    run-checks:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: r-lib/actions/setup-r@v2
            - uses: r-lib/actions/setup-renv@v2
            - run: Rscript ActionsTestScriptSuccess.R
